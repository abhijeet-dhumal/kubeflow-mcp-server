[project]
name = "kubeflow-mcp"
version = "0.1.0-dev"
requires-python = ">=3.10"
description = "Model Context Protocol server for AI-assisted development with Kubeflow"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Kubeflow Authors"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastmcp>=2.0.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "kubeflow>=0.4.0",
    "huggingface-hub>=0.20",
]

[dependency-groups]
# Keep in sync with [project.optional-dependencies] dev (pip / uv --extra dev).
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-benchmark>=5.2.3",
    "pytest-cov>=4.0",
    "pytest-benchmark>=4.0",
    "ruff>=0.9",
    "mypy>=1.10",
    "pip-audit>=2.7",
]

[tool.uv]
default-groups = ["dev"]

[project.optional-dependencies]
# ── Kubeflow SDK extras ────────────────────────────────────────────────────────
hub   = ["kubeflow[hub]>=0.4.0"]
spark = ["kubeflow[spark]>=0.4.0"]

# ── Single-framework agent extras ─────────────────────────────────────────────
# Pick exactly ONE. Each is self-contained (litellm + rich + one framework).
#
# Install size guidance (approximate transitive total):
#   agents-litellm   ~  10 MB   native loop, no framework adapter
#   agents-langchain ~ 160 MB   ReAct agent via LangChain
#   agents-smolagents ~  35 MB  HuggingFace smolagents
#   agents-llamaindex ~  60 MB  LlamaIndex workflows

agents-litellm = [
    # Lightest option — native LiteLLM agentic loop, no framework required.
    "litellm>=1.0",
    "rich>=13.0",
]
agents-langchain = [
    # LangChain ReAct agent. langchain-classic provides AgentExecutor, Tool,
    # create_react_agent, ConversationBufferMemory (pre-0.1 API, stable).
    # langchain-community is NOT required by this codebase — omitted intentionally.
    "litellm>=1.0",
    "rich>=13.0",
    "langchain-classic>=1.0",
    "langchain-core>=0.3",
    "langchain-litellm>=0.3",
]
agents-smolagents = [
    "litellm>=1.0",
    "rich>=13.0",
    "smolagents>=1.0",
]
agents-llamaindex = [
    "litellm>=1.0",
    "rich>=13.0",
    "llama-index-core>=0.12",
    "llama-index-llms-litellm>=0.3",
]

# ── Observability add-ons (framework-agnostic, compose freely) ────────────────
# These stack on top of any single-framework extra.
# Example: uv sync --extra agents-langchain --extra agents-obs --extra agents-otel

agents-obs = [
    # MLflow experiment tracking + Langfuse LLM session replay.
    # mlflow>=2.16 required for OTLP trace ingestion from OTel collector.
    # langfuse<3.0: SDK v3+ changed the tracing API and is incompatible with
    # the self-hosted Langfuse v2 server (langfuse/langfuse:2 container).
    # Upgrade to langfuse>=3.0 only when the server is also upgraded to v3+.
    "langfuse>=2.0,<3.0",
    "mlflow>=2.16",
    # MLflow's MlflowV3SpanProcessor tries to export metrics via OTLP whenever
    # OTEL_EXPORTER_OTLP_ENDPOINT is set (even when MLFLOW_ENABLE_OTLP_EXPORTER=false).
    # It uses gRPC by default for metrics, HTTP for traces. Both are needed to avoid
    # "No module named opentelemetry.exporter.otlp.proto.*" failures at span end.
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
]
agents-otel = [
    # OpenTelemetry spans → OTel Collector → Jaeger / Prometheus / MLflow.
    # Uses HTTP exporter (lighter than gRPC — no grpcio C extension).
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]

# ── Convenience bundles ───────────────────────────────────────────────────────
agents-litellm-obs = [
    # Default CLAUDE.md workflow: native litellm loop + full observability stack.
    # Equivalent to: agents-litellm + agents-obs + agents-otel
    "litellm>=1.0",
    "rich>=13.0",
    "langfuse>=2.0,<3.0",
    "mlflow>=2.16",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]

# ── Dev / CI ──────────────────────────────────────────────────────────────────
agents = [
    # ALL framework adapters in one extra. For development and CI only.
    # Production deployments should install only the specific framework needed.
    "litellm>=1.0",
    "rich>=13.0",
    "langchain-classic>=1.0",
    "langchain-core>=0.3",
    "langchain-litellm>=0.3",
    "smolagents>=1.0",
    "llama-index-core>=0.12",
    "llama-index-llms-litellm>=0.3",
]
all = [
    # Complete install including Kubeflow SDK extras + all agents + full obs.
    # Expect ~400 MB of transitive dependencies.
    "kubeflow[hub]>=0.4.0",
    "kubeflow[spark]>=0.4.0",
    "litellm>=1.0",
    "rich>=13.0",
    "langchain-classic>=1.0",
    "langchain-core>=0.3",
    "langchain-litellm>=0.3",
    "smolagents>=1.0",
    "llama-index-core>=0.12",
    "llama-index-llms-litellm>=0.3",
    "langfuse>=2.0",
    "mlflow>=2.16",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]
docs = [
    "sphinx>=7.0",
    "furo>=2024.1.29",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.5",
]
otel = [
    "opentelemetry-exporter-otlp-proto-http>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
]

[project.scripts]
kubeflow-mcp = "kubeflow_mcp.cli:cli"

[project.entry-points."kubeflow_mcp.providers"]
litellm = "kubeflow_mcp.agents.litellm_provider:LiteLLMProvider"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kubeflow_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["kubeflow_mcp", "tests"]
addopts = "-v --tb=short --cov=kubeflow_mcp --cov-report=term-missing"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["kubeflow_mcp", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C90",  # mccabe cyclomatic complexity
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.isort]
known-first-party = ["kubeflow_mcp"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["kubeflow_mcp"]
omit = [
    "*_test.py",
    "*/kubeflow_mcp/agents/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]
