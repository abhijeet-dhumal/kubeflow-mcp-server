receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318   # agent layer + FastMCP server both send here

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024
  memory_limiter:
    check_interval: 1s
    limit_mib: 256

connectors:
  # Converts spans to Prometheus metrics: calls/sec, latency histograms, error rate
  spanmetrics:
    histogram:
      explicit:
        buckets: [1ms, 5ms, 10ms, 50ms, 100ms, 500ms, 1s, 5s]
    dimensions:
      - name: gen_ai.tool.name
      - name: kubeflow.persona
      - name: tool.success
    metrics_flush_interval: 5s
    namespace: kubeflow_mcp

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317  # DNS resolved via compose service name — no static IPs
    tls:
      insecure: true

  prometheus:
    endpoint: 0.0.0.0:8889       # scraped by Prometheus

  # Uncomment to forward OTLP traces to MLflow (≥ 2.16 with OTLP receiver)
  # otlp/mlflow:
  #   endpoint: mlflow:4318
  #   tls:
  #     insecure: true

  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/jaeger, debug]
      # spanmetrics connector reads from this pipeline and emits metrics
    traces/spanmetrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [spanmetrics]
    metrics:
      receivers: [otlp, spanmetrics]
      processors: [memory_limiter, batch]
      exporters: [prometheus, debug]
